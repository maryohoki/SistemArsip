<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <!-- Clip path matching the exact inner shield contour -->
    <clipPath id="shield-inner-clip">
      <path d="M 200 32 L 298 32 C 354 84, 354 235, 354 282 C 354 350, 200 422, 200 442 C 200 422, 46 350, 46 282 C 46 235, 46 84, 102 32 Z"/>
    </clipPath>

    <!-- Curve Path for Motto Text -->
    <path id="motto-curve" d="M 75 365 Q 200 435 325 365" fill="none"/>
  </defs>

  <!-- Outer Black Shield Contour -->
  <path d="M 200 16 L 308 16 C 372 70, 372 240, 372 290 C 372 370, 200 465, 200 465 C 200 465, 28 370, 28 290 C 28 240, 28 70, 92 16 Z" fill="#263238" stroke="#1A237E" stroke-width="2"/>
  
  <!-- Outer White Margin Contour -->
  <path d="M 200 24 L 302 24 C 362 76, 362 237, 362 285 Q 362 360, 200 452 Q 38 360, 38 285 C 38 237, 38 76, 98 24 Z" fill="#FFFFFF"/>

  <!-- Inner Black Border -->
  <path d="M 200 30 L 300 30 C 356 82, 356 236, 356 284 Q 356 355, 200 445 Q 44 355, 44 284 C 44 236, 44 82, 100 30 Z" fill="#000000"/>

  <!-- Shield Fill Layer (Clipped) -->
  <g clip-path="url(#shield-inner-clip)">
    <!-- Base Green Sawah Layer (Bottom 50%) -->
    <rect x="0" y="0" width="400" height="480" fill="#689F38"/>

    <!-- White Perspective Grid Lines for Sawah -->
    <path d="M 200 215 L 0 450 M 200 215 L 70 450 M 200 215 L 130 450 M 200 215 L 270 450 M 200 215 L 330 450 M 200 215 L 400 450" stroke="#FFFFFF" stroke-width="3" opacity="0.95"/>
    <line x1="30" y1="250" x2="370" y2="250" stroke="#FFFFFF" stroke-width="3" opacity="0.95"/>
    <line x1="30" y1="295" x2="370" y2="295" stroke="#FFFFFF" stroke-width="3" opacity="0.95"/>
    <line x1="30" y1="345" x2="370" y2="345" stroke="#FFFFFF" stroke-width="3" opacity="0.95"/>
    <line x1="30" y1="400" x2="370" y2="400" stroke="#FFFFFF" stroke-width="3" opacity="0.95"/>

    <!-- Water Section (Blue background with 4 white sine wave lines) -->
    <rect x="0" y="145" width="400" height="80" fill="#00AEEF"/>
    
    <path d="M -10 160 Q 40 152, 90 160 T 190 160 T 290 160 T 390 160 T 410 160" stroke="#FFFFFF" stroke-width="4" fill="none"/>
    <path d="M -10 178 Q 40 170, 90 178 T 190 178 T 290 178 T 390 178 T 410 178" stroke="#FFFFFF" stroke-width="4" fill="none"/>
    <path d="M -10 196 Q 40 188, 90 196 T 190 196 T 290 196 T 390 196 T 410 196" stroke="#FFFFFF" stroke-width="4" fill="none"/>
    <path d="M -10 214 Q 40 206, 90 214 T 190 214 T 290 214 T 390 214 T 410 214" stroke="#FFFFFF" stroke-width="4" fill="none"/>

    <!-- Sky & Mountain Layer -->
    <path d="M 0 30 L 400 30 L 400 148 L 0 148 Z" fill="#0071BC"/>
    
    <!-- Dark Blue Mountain Peak Silhouette -->
    <path d="M 30 148 L 130 65 L 180 95 L 370 148 Z" fill="#0039A6"/>
    <path d="M 125 65 L 210 100 L 370 148 Z" fill="#002D80"/>

    <!-- Dam / Bridge Structure (White Arches & Top Line) -->
    <rect x="30" y="136" width="340" height="12" fill="#0071BC"/>
    <line x1="30" y1="136" x2="370" y2="136" stroke="#FFFFFF" stroke-width="3"/>
    
    <!-- 4 White Arch Slots on Dam -->
    <rect x="85" y="126" width="16" height="14" rx="2" fill="#FFFFFF"/>
    <rect x="150" y="126" width="16" height="14" rx="2" fill="#FFFFFF"/>
    <rect x="235" y="126" width="16" height="14" rx="2" fill="#FFFFFF"/>
    <rect x="300" y="126" width="16" height="14" rx="2" fill="#FFFFFF"/>

    <!-- Top Yellow Background Field -->
    <path d="M 0 25 L 400 25 L 400 90 Q 200 120 0 90 Z" fill="#FFEE00"/>
  </g>

  <!-- Top Text: KAB. TASIKMALAYA -->
  <text x="200" y="65" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="22" fill="#000000" text-anchor="middle" letter-spacing="1">KAB. TASIKMALAYA</text>

  <!-- Central Vertical Bamboo Pole (Bambu Runcing) -->
  <g>
    <!-- Bamboo Spear Body -->
    <path d="M 194 400 L 194 95 L 200 70 L 206 95 L 206 400 Z" fill="#FFEE00" stroke="#000000" stroke-width="2.5"/>
    <line x1="200" y1="70" x2="200" y2="400" stroke="#000000" stroke-width="1.2"/>

    <!-- Node Rings Along Bamboo Pole -->
    <line x1="193" y1="115" x2="207" y2="115" stroke="#000000" stroke-width="2.5"/>
    <line x1="193" y1="160" x2="207" y2="160" stroke="#000000" stroke-width="2.5"/>
    <line x1="193" y1="205" x2="207" y2="205" stroke="#000000" stroke-width="2.5"/>
    <line x1="193" y1="250" x2="207" y2="250" stroke="#000000" stroke-width="2.5"/>
    <line x1="193" y1="295" x2="207" y2="295" stroke="#000000" stroke-width="2.5"/>
    <line x1="193" y1="340" x2="207" y2="340" stroke="#000000" stroke-width="2.5"/>
  </g>

  <!-- Golden Wing Ornaments (Center Lower) -->
  <g fill="#FFEE00" stroke="#000000" stroke-width="2.5">
    <!-- Left Wing -->
    <path d="M 193 285 C 175 240, 125 245, 125 275 C 145 285, 165 292, 193 296 Z"/>
    <path d="M 193 296 C 165 275, 140 288, 132 312 C 152 312, 172 306, 193 303 Z"/>
    <path d="M 193 303 C 172 298, 150 312, 146 328 C 166 325, 180 318, 193 310 Z"/>

    <!-- Right Wing -->
    <path d="M 207 285 C 225 240, 275 245, 275 275 C 255 285, 235 292, 207 296 Z"/>
    <path d="M 207 296 C 235 275, 260 288, 268 312 C 248 312, 228 306, 207 303 Z"/>
    <path d="M 207 303 C 228 298, 250 312, 254 328 C 234 325, 220 318, 207 310 Z"/>
  </g>

  <!-- Bottom Yellow Ribbon Scroll: SUKAPURA NGADAUN NGORA -->
  <g>
    <!-- Ribbon Tail Left -->
    <path d="M 85 340 L 60 325 L 70 355 L 48 370 L 92 370 Z" fill="#FFEE00" stroke="#000000" stroke-width="2.5"/>
    <!-- Ribbon Tail Right -->
    <path d="M 315 340 L 340 325 L 330 355 L 352 370 L 308 370 Z" fill="#FFEE00" stroke="#000000" stroke-width="2.5"/>

    <!-- Main Yellow Scroll Body -->
    <path d="M 72 342 Q 200 410 328 342 L 318 372 Q 200 440 82 372 Z" fill="#FFEE00" stroke="#000000" stroke-width="3"/>

    <!-- Text SUKAPURA NGADAUN NGORA -->
    <text font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="14.5" fill="#000000">
      <textPath href="#motto-curve" startOffset="50%" text-anchor="middle">SUKAPURA NGADAUN NGORA</textPath>
    </text>
  </g>
</svg>
