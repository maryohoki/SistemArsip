<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Memuat Sistem...</title>
  <style>
    body {
      margin: 0; padding: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; height: 100vh;
      background: #F0FDF4; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #1F2937;
    }
    .loader {
      border: 8px solid #E5E7EB;
      border-top: 8px solid #166534;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    h2 { margin: 0; font-size: 1.5rem; color: #166534; }
    p { margin-top: 10px; color: #6B7280; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="loader"></div>
  <h2>Memulai Sistem Arsip Desa...</h2>
  <p>Menyiapkan database dan server lokal. Harap tunggu sebentar.</p>
</body>
</html>
